<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Football Team Tracker: player tracking and team assignment from broadcast video">
  <title>Football Team Tracker</title>
  <rect width="1280" height="640" fill="#0f1b2d"/>
  <!-- pitch markings, right side -->
  <g fill="none" stroke="#3ddc84" stroke-opacity="0.24" stroke-width="2.5">
