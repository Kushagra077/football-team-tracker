    <ellipse cx="892" cy="226" rx="20" ry="7" stroke="#ff9f1c"/>
    <ellipse cx="1010" cy="430" rx="20" ry="7" stroke="#ff9f1c"/>
    <ellipse cx="812" cy="292" rx="20" ry="7" stroke="#ff9f1c"/>
    <ellipse cx="1010" cy="232" rx="20" ry="7" stroke="#2ec4e6"/>
    <ellipse cx="1058" cy="330" rx="20" ry="7" stroke="#2ec4e6"/>
