    <line x1="946" y1="135" x2="946" y2="505"/>
    <circle cx="946" cy="320" r="50"/>
    <rect x="660" y="211" width="90" height="218"/>
    <rect x="1142" y="211" width="90" height="218"/>
    <rect x="660" y="270" width="30" height="100"/>
    <rect x="1202" y="270" width="30" height="100"/>
  </g>
  <circle cx="946" cy="320" r="4" fill="#3ddc84" fill-opacity="0.4"/>
