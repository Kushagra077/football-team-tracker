    <rect x="824" y="374" width="32" height="21" rx="3" fill="#ff9f1c"/><text x="840" y="390" fill="#0f1b2d">7</text>
    <rect x="876" y="238" width="32" height="21" rx="3" fill="#ff9f1c"/><text x="892" y="254" fill="#0f1b2d">12</text>
    <rect x="994" y="442" width="32" height="21" rx="3" fill="#ff9f1c"/><text x="1010" y="458" fill="#0f1b2d">31</text>
    <rect x="796" y="304" width="32" height="21" rx="3" fill="#ff9f1c"/><text x="812" y="320" fill="#0f1b2d">5</text>
    <rect x="994" y="244" width="32" height="21" rx="3" fill="#2ec4e6"/><text x="1010" y="260" fill="#0f1b2d">4</text>
    <rect x="1042" y="342" width="32" height="21" rx="3" fill="#2ec4e6"/><text x="1058" y="358" fill="#0f1b2d">19</text>
    <rect x="1084" y="458" width="32" height="21" rx="3" fill="#2ec4e6"/><text x="1100" y="474" fill="#0f1b2d">23</text>
    <rect x="1176" y="332" width="52" height="21" rx="3" fill="#e8edf3"/><text x="1202" y="348" fill="#0f1b2d">GK 1</text>
