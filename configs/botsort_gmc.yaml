# BoT-SORT + global motion compensation. Hypothesis: matters a lot (panning main camera).
name: botsort_gmc
frame_rate: 25
high_conf_threshold: 0.5
low_conf_threshold: 0.1
match_threshold: 0.8
track_buffer: 30
gmc_method: sparseOptFlow     # name depends on library (e.g. ecc / orb / sift / sparseOptFlow)
with_reid: false
