# BoT-SORT + global motion compensation. Hypothesis: matters a lot (panning main camera).
name: botsort_gmc
tracker_type: botsort
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 30
match_thresh: 0.8
fuse_score: true
gmc_method: sparseOptFlow     # Ultralytics: sparseOptFlow | orb | sift | ecc | none
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: false
model: auto
