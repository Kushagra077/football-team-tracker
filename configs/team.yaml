# Team assignment v1: colour clustering. All values are initial guesses to be evaluated, not tuned.
crop:
  y_top: 0.15                 # torso band as fraction of box height (legs/head add grass + skin noise)
  y_bottom: 0.50
  x_trim: 0.20                # drop this fraction of width on each side (arms, neighbours)
grass_mask:                   # OpenCV HSV ranges (H 0-179)
  h: [34, 42]                 # pitch hue is 35-40 on all 11 val clips; wider (35-85) ate green shirts
  s_min: 40
  v_min: 40
features:
  kind: hist_lab              # mean_lab | hist_lab (colour histogram: keeps both stripes of a striped kit)
cluster:
  k: 2
  fit_frames: 50              # first N frames of the clip that look like a pitch view
  fit_min_players: 3          # a frame counts only if it shows this many player boxes
  fit_on: player              # players only; keepers/referees would pull centroids apart
pitch_view:                   # upload path only: trust team colours on wide pitch views
  min_players: 3
  max_box_height: 0.20        # median player height / frame height; SoccerNet val max is 0.166.
                              # Also applied per box: a taller player box gets no team
  max_colour_ratio: 1.0       # colour far from both teams -> no team (black-kit referee/keeper called "player"); 0.7 dropped 19% of white-kit players on SportsMOT
goalkeeper:
  assign_by: nearest_centroid_x   # crude heuristic; pitch coordinates (a planned follow-up) fix it properly
  min_team_gap: 150           # px (of 1920): teams' average x closer than this -> unknown
  min_margin: 60              # px: keeper must be this much nearer one team, else unknown
vote:
  window: 25                  # frames (1 s at 25 fps)
  lock_min_agree: null        # null = never lock. A lock at 15 cost 6.4 acc points: tracker id swaps
  centred: true               # look window//2 frames back AND forward (the pipeline is offline). Chosen on val: the
                              # causal vote cost 0.1-0.3 acc points vs no vote; the centred one gains 0.3 (val)
fps: 25
