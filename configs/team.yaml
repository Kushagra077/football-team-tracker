# Team assignment v1: colour clustering. All values are initial guesses to be evaluated, not tuned.
crop:
  y_top: 0.15                 # torso band as fraction of box height (legs/head add grass + skin noise)
  y_bottom: 0.50
  x_trim: 0.20                # drop this fraction of width on each side (arms, neighbours)
grass_mask:                   # OpenCV HSV ranges (H 0-179)
  h: [34, 42]                 # pitch hue is 35-40 on all 11 val clips; wider (35-85) ate green shirts
  s_min: 40
  v_min: 40
features:
  color_space: lab            # lab | rgb | hsv
cluster:
  k: 2
  fit_frames: 50              # first N frames of the clip that look like a pitch view
  fit_min_players: 3          # a frame counts only if it shows this many player boxes (DD-023)
  fit_on: player              # players only; keepers/referees would pull centroids apart
pitch_view:                   # upload path only: trust team colours on wide pitch views (DD-025)
  min_players: 3
  max_box_height: 0.20        # median player height / frame height; SoccerNet val max is 0.166
goalkeeper:
  assign_by: nearest_centroid_x   # crude heuristic; A3 pitch coords fix it properly
  min_team_gap: 150           # px (of 1920): teams' average x closer than this -> unknown
  min_margin: 60              # px: keeper must be this much nearer one team, else unknown
vote:
  window: 25                  # frames (1 s at 25 fps)
  lock_min_agree: null        # null = never lock. A lock at 15 cost 6.4 acc points: tracker id swaps (DD-022)
fps: 25
