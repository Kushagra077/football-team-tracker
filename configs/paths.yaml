# The detector project (football-detect-serve) is referenced, never copied. Paths are relative to this repo root.
detector_weights: ../football-detect-serve/models/football_detection_v6.pt   # pinned: v6 (1280 px input), the best detector on val; v3 was the first one used. v6.pt is not in the detector repo: see the README's Setup

# Original SoccerNet-Tracking text files (gt.txt, gameinfo.ini, seqinfo.ini, det.txt), copied from Drive.
meta_root: data/raw_meta          # data/raw_meta/{train,test}/<clip>/...
# Frames: the detector project's local YOLO copy, byte-identical to the originals (verified on 318 sampled frames).
# Names are <clip>_<frame:06d>.jpg inside images/{train,val,test}/.
detector_images: ../football-detect-serve/dataset/images
cache_dir: cache                  # cache/detections/<detector>/<clip>.parquet, cache/tracks/<detector>/<clip>__<config>__tuned.parquet
reports_dir: reports
