# BoT-SORT + GMC + appearance ReID. Same as botsort_gmc.yaml except with_reid is on and the encoder is
# Ultralytics' trained ReID model (yolo26n-reid.onnx, downloaded on first use; needs onnxruntime).
# Hypothesis: ReID helps less here than on pedestrian benchmarks, since teammates wear identical kits.
name: botsort_gmc_reid
tracker_type: botsort
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 30
match_thresh: 0.8
fuse_score: true
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: true
model: yolo26n-reid.onnx
