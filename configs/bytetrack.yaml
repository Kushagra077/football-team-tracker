# ByteTrack (Ultralytics): motion (Kalman) + IoU association, two passes (high- then low-confidence).
# Keys are Ultralytics' own; `name` is ours and is stripped before the tracker sees the config.
# Values are STARTING points to be tuned on the dev (val) clips, not recommendations.
name: bytetrack
tracker_type: bytetrack
track_high_thresh: 0.5        # first-pass boxes (oracle conf = 1.0 always passes)
track_low_thresh: 0.1         # second-pass boxes; real detections must be cached at <= this
new_track_thresh: 0.5         # start a new track only from a confident box
track_buffer: 30              # frames a lost track survives (1.2 s at 25 fps)
match_thresh: 0.8
fuse_score: true
