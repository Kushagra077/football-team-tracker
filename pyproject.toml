[project]
name = "football-team-tracker"
version = "0.1.0"
description = "Multi-object tracking + team assignment for football broadcast video, evaluated with HOTA/IDF1 against SoccerNet-Tracking ground truth (oracle vs real detections)."
readme = "README.md"
requires-python = ">=3.13"

# Trackers come from Ultralytics (AGPL-3.0, so this repo is AGPL-3.0 too); metrics from TrackEval.
# Pinned where APIs drift between releases. `lap` is required by Ultralytics' trackers.
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "scipy",
    "scikit-learn",
    "opencv-python",
    "trackeval==1.3.0",
    "ultralytics>=8.4.183",
    "lap>=0.5.13",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftt"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
# Notebooks are learning scratch, not library code.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: needs SoccerNet data / GPU outputs; skipped in CI",
]
